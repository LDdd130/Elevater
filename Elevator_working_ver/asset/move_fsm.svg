<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Elevator 이동 상태 머신</title>
  <desc id="desc">IDLE에서 층 호출을 받아 문 닫힘을 확인하고, 요청 보류 또는 RUNNING으로 전환한 뒤 초음파 hit count나 30초 timeout에 따라 종료하는 흐름이다.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.panel{fill:#f6f8fa;stroke:#d0d7de}.card{fill:#fff;stroke:#8c959f}.fillA{fill:#ddf4ff;stroke:#54aeff}.fillB{fill:#ffebe9;stroke:#ff8182}.fillC{fill:#fbefff;stroke:#d8b9ff}.fillN{fill:#eef1f4;stroke:#afb8c1}
      .t{fill:#1f2328;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}.m,.lbl{fill:#656d76;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}.k{fill:#1f2328;font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
      .hdr{fill:#0969da;font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.hdrB{fill:#cf222e;font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.hdrC{fill:#8250df;font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
      .wire{stroke:#7d8590;fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}.wired{stroke:#7d8590;fill:none;stroke-width:1.4;stroke-dasharray:5 4;stroke-linejoin:round;stroke-linecap:round}
      @media(prefers-color-scheme:dark){.bg{fill:#0d1117}.panel{fill:#161b22;stroke:#30363d}.card{fill:#0d1117;stroke:#6e7681}.fillA{fill:#12283f;stroke:#316dca}.fillB{fill:#3c1618;stroke:#b62324}.fillC{fill:#271052;stroke:#8957e5}.fillN{fill:#21262d;stroke:#484f58}.t,.k{fill:#e6edf3}.m,.lbl{fill:#9198a1}.hdr{fill:#58a6ff}.hdrB{fill:#ff7b72}.hdrC{fill:#d2a8ff}.wire,.wired{stroke:#7d8590}}
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7d8590"/></marker>
  </defs>

  <rect class="bg" width="980" height="620"/>
  <rect x="24" y="24" width="932" height="572" rx="10" class="panel" stroke-width="1.2"/>
  <text x="44" y="51" class="hdr">Move State Machine</text>
  <text x="204" y="51" class="m" font-size="11">문 인터록과 초음파 도착 판정</text>

  <rect x="350" y="72" width="280" height="62" rx="7" class="fillA" stroke-width="1.2"/>
  <text x="364" y="97" class="k" font-size="12" font-weight="700">STEPPER_MOVE_IDLE</text>
  <text x="364" y="118" class="m" font-size="9.5">유효한 새 층 호출 대기</text>
  <line x1="490" y1="134" x2="490" y2="184" class="wire" marker-end="url(#ah)"/>
  <text x="505" y="162" class="lbl" font-size="9.5">RequestMoveToFloor(target)</text>

  <rect x="350" y="184" width="280" height="80" rx="7" class="fillC" stroke-width="1.2"/>
  <text x="364" y="209" class="k" font-size="12" font-weight="700">is_door_closed()?</text>
  <text x="364" y="231" class="t" font-size="10">문이 닫혀야 이동 허용</text>
  <text x="364" y="249" class="m" font-size="9.5">현재 층 확인 후 회전 방향 결정</text>

  <polyline points="350,224 300,224 300,320 270,320" class="wire" marker-end="url(#ah)"/>
  <text x="310" y="215" class="lbl" font-size="9.5">NO</text>
  <rect x="54" y="282" width="216" height="76" rx="7" class="fillC" stroke-width="1.2"/>
  <text x="68" y="306" class="k" font-size="10.5" font-weight="700">Pending Request</text>
  <text x="68" y="327" class="t" font-size="10">close_door_request()</text>
  <text x="68" y="345" class="m" font-size="9.5">pendingMoveFloor 저장</text>
  <polyline points="270,340 324,340 324,244 350,244" class="wired" marker-end="url(#ah)"/>
  <text x="332" y="294" class="lbl" font-size="9">문 닫힌 뒤 재시도</text>

  <line x1="490" y1="264" x2="490" y2="304" class="wire" marker-end="url(#ah)"/>
  <text x="505" y="287" class="lbl" font-size="9.5">YES</text>
  <rect x="350" y="304" width="280" height="82" rx="7" class="fillN" stroke-width="1.2"/>
  <text x="364" y="329" class="k" font-size="12" font-weight="700">STEPPER_MOVE_RUNNING</text>
  <text x="364" y="351" class="t" font-size="10">2 ms마다 Full-step · 초음파 재측정</text>
  <text x="364" y="370" class="m" font-size="9.5">이동 중 새 요청은 즉시 반려</text>

  <line x1="630" y1="345" x2="712" y2="345" class="wire" marker-end="url(#ah)"/>
  <text x="671" y="335" class="lbl" font-size="9.5" text-anchor="middle">30 s 초과</text>
  <rect x="712" y="304" width="214" height="82" rx="7" class="fillB" stroke-width="1.2"/>
  <text x="726" y="329" class="k" font-size="10.5" font-weight="700">STEPPER_MOVE_TIMEOUT</text>
  <text x="726" y="351" class="t" font-size="10">Stepper_Stop()</text>
  <text x="726" y="370" class="m" font-size="9.5">Coil OFF · 오류 반환</text>

  <line x1="490" y1="386" x2="490" y2="440" class="wire" marker-end="url(#ah)"/>
  <text x="505" y="417" class="lbl" font-size="9.5">목표 층 hit count 충족</text>
  <rect x="350" y="440" width="280" height="72" rx="7" class="fillA" stroke-width="1.2"/>
  <text x="364" y="465" class="k" font-size="12" font-weight="700">STEPPER_MOVE_ARRIVED</text>
  <text x="364" y="487" class="m" font-size="9.5">회전 없이 이미 도착한 경우도 포함</text>
  <text x="364" y="503" class="m" font-size="9.5">RUNNING → ARRIVED Edge에서 후처리</text>
  <line x1="490" y1="512" x2="490" y2="544" class="wire" marker-end="url(#ah)"/>
  <rect x="350" y="544" width="280" height="34" rx="17" class="fillB" stroke-width="1.2"/>
  <text x="490" y="566" class="k" font-size="10.5" text-anchor="middle" font-weight="700">open_door_request()</text>

  <rect x="54" y="448" width="216" height="96" rx="7" class="card" stroke-width="1.2"/>
  <text x="68" y="472" class="k" font-size="10.5" font-weight="700">Request Guard</text>
  <text x="68" y="493" class="t" font-size="10">target ∉ 1~3 → INVALID</text>
  <text x="68" y="512" class="t" font-size="10">RUNNING 중 호출 → reject</text>
  <text x="68" y="531" class="m" font-size="9.5">상태와 구동 출력을 변경하지 않음</text>
  <rect x="712" y="448" width="214" height="96" rx="7" class="card" stroke-width="1.2"/>
  <text x="726" y="472" class="k" font-size="10.5" font-weight="700">Arrival Edge</text>
  <text x="726" y="493" class="t" font-size="10">문 열림 요청 1회</text>
  <text x="726" y="512" class="t" font-size="10">층 표시 · Tone · BT 보고</text>
  <text x="726" y="531" class="m" font-size="9.5">매 Loop 반복 호출 방지</text>
</svg>
